<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Roster | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #0f172a; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.8); }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-6xl font-bold uppercase neon-text text-white italic">
                Player <span class="text-blue-500">Database</span>
            </h1>
        </header>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for student in students %}
            <div class="glass-card rounded-xl overflow-hidden transition-all duration-300 hover:border-blue-500">
                <div class="relative">
                    <img src="{{ student.photo }}" alt="{{ student.nickname }}" class="w-full h-64 object-cover">
                    <div class="absolute top-4 left-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-sm">
                        ID: {{ student.id }}
                    </div>
                    <div class="absolute bottom-4 right-4 bg-black/60 border border-white/20 text-blue-400 text-xs px-2 py-1 uppercase font-bold">
                        {{ student.role }}
                    </div>
                </div>
                <div class="p-5 border-t border-white/10">
                    <h3 class="text-3xl font-bold text-white uppercase italic">{{ student.nickname }}</h3>
                    <p class="text-slate-400 text-sm font-semibold">{{ student.name }} {{ student.surname }}</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="mt-12 glass-card p-6 rounded-xl">
            <h2 class="text-2xl font-bold mb-4">Systémový Log (Správy)</h2>
            <form method="POST" class="mb-6 flex gap-2">
                <input type="text" name="content" placeholder="Napíš správu..." class="bg-slate-800 border border-slate-700 rounded p-2 flex-grow text-white">
                <button type="submit" class="bg-blue-600 px-4 py-2 rounded font-bold">ODOSLAŤ</button>
            </form>
            <ul>
                {% for sprava in spravy %}
                <li class="border-b border-white/5 py-2 text-slate-300">> {{ sprava.obsah }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
